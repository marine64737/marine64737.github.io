<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Word</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav { background-color: #04fff2; font-weight: bold; padding: 10px; text-align: left; margin-bottom: 40px;}
        nav a { color: black; margin: 0 15px; text-decoration: none; font-size: 18px; padding: 10px;}
        nav a:hover {  background-color: #ffcc00; padding: 10px;}
        h1, h2 {
            color: #333;
        }
        .profile{
            display: flex;
            align-items: center;
        }
        .profile img{
            /*border-radius: 60%;*/
            width: 240px;
            margin-right: 20px;
        }
        .hidden {
            display: none;
        }
        table{
            border-collapse: collapse;
        }
        table, td, th{
            border:1px solid #bbb;
        }
        td, th{
            padding: 10px;
            text-align: center;
        }
        form{
            margin-top: 30px;
        }
        input, textarea{
            width: 300px;
            padding: 8px;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <h1>Word</h1>
    <h2>일본어 단어장 <span id="total-count" style="font-size: 0.5em; color: gray;"></span></h2>
    <div class="input-group">
        <h2>단어 추가</h2>
        <input type="text" id="kanji" placeholder="한자 (Kanji)">
        <input type="text" id="reading" placeholder="읽기 (Reading)">
        <input type="text" id="meaning" placeholder="의미 (Meaning)">
        <button onclick="checkWord()">중복확인</button>
        <button onclick="saveWord()">저장하기</button>
        <span id="message-area" style="margin-left: 10px;"></span>
    </div>
    <div class="search">
        <h2>단어 수정</h2>
        <input type="text" id="search-kanji" placeholder="한자 (Kanji)">
        <button onclick="searchWord()">검색</button>
        <button class="hidden" id="cancel" onclick="cancel(this)">취소</button>
        <span id="search-message" style="margin-left: 10px;"></span>
    </div>
    <div class="hidden" id="search-result">
        <input type="text hidden" id="id-search">
        <input type="text" id="search-kanji" placeholder="한자 (Kanji)">
        <input type="text" id="search-reading" placeholder="읽기 (Reading)">
        <input type="text" id="search-meaning" placeholder="의미 (Meaning)">
        <button onclick="updateWord()">수정</button>
        <span id="update-message" style="margin-left: 10px;"></span>
    </div>
    <table border="1">
    <thead>
        <tr>
            <th>한자 (Kanji)</th>
            <th>읽기 (Reading)</th>
            <th>의미 (Meaning)</th>
        </tr>
    </thead>
    <tbody id="word-list">
    </tbody>
</table>

<script src="word.js"></script>

</body>
</html>
